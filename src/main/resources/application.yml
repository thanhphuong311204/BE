server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: fashion-api
    ttl-seconds: ${JWT_TTL_SECONDS:3600}
  cors-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5000}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    dynamic-folders: ${CLOUDINARY_DYNAMIC_FOLDERS:true}

# Multipart transport diagnostics may contain API keys/signatures; never log them.
logging:
  level:
    org.springframework.web.client: WARN
    org.springframework.http.converter: WARN
    # MVC debug diagnostics can include rejected password fields on validation errors.
    org.springframework.web.servlet.mvc.method.annotation: WARN
