spring:
  datasource:
    url: jdbc:h2:mem:fashion_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
  jpa:
    hibernate:
      ddl-auto: validate
app:
  jwt:
    # Test key only; never used by the production application.
    secret: test-only-secret-with-at-least-32-bytes-do-not-deploy
logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
